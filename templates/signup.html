<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create an Account</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap"
          rel="stylesheet">

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<div class="login-container">

    <div class="login-box">

        <svg class="sprig" viewBox="0 0 60 44" fill="none" aria-hidden="true">
            <path d="M30 42V16" stroke="#6d7d5e" stroke-width="1.3" stroke-linecap="round"/>
            <path d="M30 30C24 30 20 27 18 22c6-1 10 2 12 8Z" fill="#8a9a78" opacity=".55"/>
            <path d="M30 34c6 0 10-3 12-8-6-1-10 2-12 8Z" fill="#8a9a78" opacity=".55"/>
            <circle cx="30" cy="12" r="5" fill="#c0808a" opacity=".55"/>
            <circle cx="21" cy="17" r="3.4" fill="#c0808a" opacity=".4"/>
            <circle cx="39" cy="17" r="3.4" fill="#c0808a" opacity=".4"/>
            <circle cx="30" cy="12" r="1.8" fill="#4c3a2c" opacity=".5"/>
        </svg>

        <h1>Create an Account</h1>

        <p class="subtitle">
            Join the club registry
        </p>

        {% if error %}
            <div class="error">
                {{ error }}
            </div>
        {% endif %}

        <form method="POST">

            <label for="name">Full name</label>

            <input
                id="name"
                type="text"
                name="name"
                value="{{ form.name or '' }}"
                placeholder="Juan Dela Cruz"
                required
            >

            <label for="phone">Contact number</label>
            <input
                id="phone"
                type="tel"
                name="phone"
                value="{{ form.phone or '' }}"
                placeholder="+1 555 010 1234"
                pattern="[0-9+(). -]{7,20}"
                autocomplete="tel"
                required
            >
            <p class="hint">We&apos;ll only use this for club membership updates.</p>

            <label for="role">I am joining as</label>


            <select id="role" name="role" required>

                <option value="student"
                    {% if form.role != 'staff' %}selected{% endif %}>
                    Student
                </option>

                <option value="staff"
                    {% if form.role == 'staff' %}selected{% endif %}>
                    Staff
                </option>

            </select>

            <label for="student_id">Student ID</label>

            <input
                id="student_id"
                type="text"
                name="student_id"
                value="{{ form.student_id or '' }}"
                placeholder="2024-0001"
            >

            <p class="hint">Staff members can leave this blank.</p>

            <div class="field-row">

                <div>
                    <label for="year_level">Year level</label>

                    <select id="year_level" name="year_level">

                        <option value="">Not applicable</option>

                        <option value="1st Year"
                            {% if form.year_level == '1st Year' %}selected{% endif %}>
                            1st Year
                        </option>

                        <option value="2nd Year"
                            {% if form.year_level == '2nd Year' %}selected{% endif %}>
                            2nd Year
                        </option>

                        <option value="3rd Year"
                            {% if form.year_level == '3rd Year' %}selected{% endif %}>
                            3rd Year
                        </option>

                        <option value="4th Year"
                            {% if form.year_level == '4th Year' %}selected{% endif %}>
                            4th Year
                        </option>

                        <option value="5th Year"
                            {% if form.year_level == '5th Year' %}selected{% endif %}>
                            5th Year
                        </option>

                    </select>
                </div>

                <div>
                    <label for="department">Department</label>

                    <input
                        id="department"
                        type="text"
                        name="department"
                        value="{{ form.department or '' }}"
                        placeholder="College of Engineering"
                    >
                </div>

            </div>

            <p class="hint">Staff members can leave year level and department blank.</p>

            <label for="username">Username</label>

            <input
                id="username"
                type="text"
                name="username"
                value="{{ form.username or '' }}"
                placeholder="At least 4 characters, no spaces"
                required
            >

            <div class="field-row">

                <div>
                    <label for="password">Password</label>

                    <input
                        id="password"
                        type="password"
                        name="password"
                        placeholder="6+ characters"
                        required
                    >
                </div>

                <div>
                    <label for="confirm">Repeat password</label>

                    <input
                        id="confirm"
                        type="password"
                        name="confirm"
                        placeholder="Type it again"
                        required
                    >
                </div>

            </div>

            <button type="submit">
                Create account
            </button>

        </form>

        <p class="switch">
            Already have an account?
            <a href="{{ url_for('login') }}">Sign in</a>
        </p>

    </div>

</div>

</body>
</html>
